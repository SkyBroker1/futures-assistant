name: Futures Assistant - cloud

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check sources
        run: |
          set -euo pipefail
          for f in scripts/cloud_collect.py .github/workflows/run_futures_assistant.yml; do
            if grep -qE '^(diff --git|@@|\+{3}|\-{3})' "$f"; then
              echo "::error::$f містить diff-маркери. Встав чистий код, не patch."
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cloud collector
        env:
          OUT_DIR: out
          LOG_DIR: log
          MAX_JSON_MB: "2.5"
        run: |
          set -euo pipefail
          mkdir -p out log
          python scripts/cloud_collect.py

      - name: Write run metadata
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          cat > out/run_meta.json <<EOF
          {
            "run_id": "${RUN_ID}",
            "run_url": "${RUN_URL}",
            "commit": "${SHA}",
            "commit_url": "${COMMIT_URL}",
            "ref": "${REF}",
            "actor": "${ACTOR}",
            "event": "${EVENT}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Echo health to logs
        run: |
          jq -r '.generated_at + " conf=" + ( .conf|tostring )' out/index.json || true
          jq -r '.log.quorum' out/tripack_meta_v2.json || true

      - name: Summarize & validate
        run: |
          test -s out/index.json
          test -s out/tripack_meta_v2.json
          test -s out/run_meta.json

      - name: Upload cloud artifacts - out
        uses: actions/upload-artifact@v4
        with:
          name: out_cloud
          path: out/

      - name: Upload cloud artifacts - logs
        uses: actions/upload-artifact@v4
        with:
          name: logs_cloud
          path: log/

      - name: Add run summary
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = process.env.RUN_ID;
            const sha = process.env.SHA;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const dataPath = `https://github.com/${owner}/${repo}/tree/data-cloud/public/out/${runId}/`;
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${sha}`;
            await core.summary
              .addHeading('Futures Assistant - summary')
              .addList([
                `Run: ${runUrl}`,
                `Data-cloud: ${dataPath}`,
                `Commit: ${sha.substring(0,10)} (${commitUrl})`
              ]).write();

      - name: Publish JSON to data-cloud branch
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          DEST="public/out/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin data-cloud; then
            git checkout -B data-cloud origin/data-cloud
          else
            git checkout --orphan data-cloud
            rm -rf *
            echo "# data-cloud" > README.md
            git add README.md
            git commit -m "init data-cloud"
            git push -u origin data-cloud
          fi
          mkdir -p "${DEST}"
          cp -f out/*.json "${DEST}/"
          git add "${DEST}"
          git commit -m "Publish out to data-cloud: ${RUN_ID}" || true
          git push origin data-cloud
