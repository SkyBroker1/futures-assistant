name: Futures Assistant - cloud

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check sources
        run: |
          set -euo pipefail
          # забороняємо випадкові diff-маркери в python/yaml
          for f in scripts/cloud_collect.py .github/workflows/run_futures_assistant.yml; do
            if grep -qE '^(diff --git|@@|\+{3}|\-{3})' "$f"; then
              echo "::error::$f містить diff-маркери. Встав чистий код, не patch."
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cloud collector
        env:
          OUT_DIR: out
          LOG_DIR: log
          MAX_JSON_MB: "2.5"
        run: |
          set -euo pipefail
          mkdir -p out log
          python scripts/cloud_collect.py

      - name: Echo health to logs
        run: |
          jq -r '.generated_at + " conf=" + ( .conf|tostring )' out/index.json || true
          jq -r '.log.quorum' out/tripack_meta_v2.json || true

      - name: Summarize & validate
        run: |
          test -s out/index.json
          test -s out/tripack_meta_v2.json

      - name: Upload cloud artifacts - out
        uses: actions/upload-artifact@v4
        with:
          name: out_cloud
          path: out/

      - name: Upload cloud artifacts - logs
        uses: actions/upload-artifact@v4
        with:
          name: logs_cloud
          path: log/

      - name: Publish JSON to data-cloud branch
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          DEST="public/out/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-cloud origin/data-cloud || git checkout -b data-cloud
          mkdir -p "${DEST}"
          cp -f out/*.json "${DEST}/"
          git add "${DEST}"
          git commit -m "Publish out to data-cloud: ${RUN_ID}" || true
          git push origin data-cloud
