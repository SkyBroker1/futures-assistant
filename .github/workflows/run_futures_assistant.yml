name: Futures Assistant - cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # запуск кожні 30 хв

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Write .env from GitHub Secrets
        run: |
          mkdir -p out log
          cat > .env <<'EOF'
          BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
          COINALYZE_API_KEY=${{ secrets.COINALYZE_API_KEY }}
          CRYPTOCOMPARE_API_KEY=${{ secrets.CRYPTOCOMPARE_API_KEY }}
          SANTIMENT_API_KEY=${{ secrets.SANTIMENT_API_KEY }}
          DERIBIT_CLIENT_ID=${{ secrets.DERIBIT_CLIENT_ID }}
          DERIBIT_API_KEY=${{ secrets.DERIBIT_API_KEY }}
          ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}
          CMC_API_KEY=${{ secrets.CMC_API_KEY }}
          OUT_DIR=out
          LOG_DIR=log
          EOF

      - name: Run cloud collector
        env:
          OUT_DIR: out
          LOG_DIR: log
        run: |
          mkdir -p out log
          python scripts/cloud_collect.py

      - name: Upload cloud artifacts - out
        uses: actions/upload-artifact@v4
        with:
          name: out_cloud
          path: out/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload cloud artifacts - logs
        uses: actions/upload-artifact@v4
        with:
          name: logs_cloud
          path: log/**
          if-no-files-found: warn
          retention-days: 7
