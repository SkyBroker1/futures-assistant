name: Futures Assistant - cloud

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    runs-on: ubuntu-latest

        steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # sanity - ловимо випадкові diff-артефакти в коді/requirements
    - name: Sanity check sources
      run: |
        set -e
        # cloud_collect.py не повинен містити diff-маркери
        if grep -qE '^(diff --git|@@|\+{3}|\-{3})' scripts/cloud_collect.py; then
          echo "cloud_collect.py містить diff-маркери. Встав чистий Python, не patch." >&2
          exit 1
        fi
        # requirements.txt не повинен містити diff-маркери або '@@'
        if grep -qE '^(diff --git|@@|\+{3}|\-{3})|@@' requirements.txt; then
          echo "requirements.txt містить diff-маркери/@@. Встав чистий список пакетів." >&2
          exit 1
        fi

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run cloud collector
      env:
        OUT_DIR: out
        LOG_DIR: log
      run: |
        mkdir -p out log
        python scripts/cloud_collect.py

    - name: Echo health to logs
      run: |
        echo "== HEALTH INDEX ==" >> log/cloud.txt || true
        if [ -f out/index.json ]; then head -c 4000 out/index.json >> log/cloud.txt; echo "" >> log/cloud.txt; fi
        if [ -f out/tripack_meta_v2.json ]; then head -c 6000 out/tripack_meta_v2.json >> log/cloud.txt; echo "" >> log/cloud.txt; fi

    - name: Upload cloud artifacts - out
      uses: actions/upload-artifact@v4
      with:
        name: out_cloud
        path: out/*.json
        if-no-files-found: error

    - name: Upload cloud artifacts - logs
      uses: actions/upload-artifact@v4
      with:
        name: logs_cloud
        path: log/*.txt
        if-no-files-found: warn

    - name: Publish JSON to data-cloud branch
      if: always()
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        set -e
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"

        SAFE_DIR="${RUNNER_TEMP}/out_publish"
        mkdir -p "$SAFE_DIR"
        cp -r out/*.json "$SAFE_DIR"/ 2>/dev/null || true

        git fetch origin
        if git ls-remote --exit-code --heads origin data-cloud; then
          git checkout -B data-cloud origin/data-cloud
        else
          git checkout --orphan data-cloud
          rm -rf * .[^.]* || true
          echo "# data-cloud" > README.md
          git add README.md
          git commit -m "init data-cloud"
          git push -u origin data-cloud
        fi

        mkdir -p "public/out/${RUN_ID}"
        cp -r "$SAFE_DIR"/* "public/out/${RUN_ID}/" 2>/dev/null || true
        git add -f "public/out/${RUN_ID}"/* 2>/dev/null || true
        git commit -m "publish out for run ${RUN_ID}" || echo "nothing to commit"
        git push origin data-cloud
