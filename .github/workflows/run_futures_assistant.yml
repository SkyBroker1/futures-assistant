name: Futures Assistant - cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # кожні 30 хв

permissions:
  contents: write  # потрібно для коміту JSON у гілку data-cloud

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Write .env from GitHub Secrets
        run: |
          mkdir -p out log
          cat > .env <<'EOF'
          BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
          COINALYZE_API_KEY=${{ secrets.COINALYZE_API_KEY }}
          CRYPTOCOMPARE_API_KEY=${{ secrets.CRYPTOCOMPARE_API_KEY }}
          SANTIMENT_API_KEY=${{ secrets.SANTIMENT_API_KEY }}
          DERIBIT_CLIENT_ID=${{ secrets.DERIBIT_CLIENT_ID }}
          DERIBIT_API_KEY=${{ secrets.DERIBIT_API_KEY }}
          ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}
          CMC_API_KEY=${{ secrets.CMC_API_KEY }}
          OUT_DIR=out
          LOG_DIR=log
          EOF

      - name: Run cloud collector
        env:
          OUT_DIR: out
          LOG_DIR: log
        run: |
          mkdir -p out log
          python scripts/cloud_collect.py

      - name: Upload cloud artifacts - out
        uses: actions/upload-artifact@v4
        with:
          name: out_cloud
          path: out/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload cloud artifacts - logs
        uses: actions/upload-artifact@v4
        with:
          name: logs_cloud
          path: log/**
          if-no-files-found: warn
          retention-days: 14

      # Публікація «живих» JSON у гілку data-cloud, поза .gitignore
      - name: Publish JSON to data-cloud branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          # збережемо out/ тимчасово
          mkdir -p .tmp_publish && cp -r out .tmp_publish/

          # створимо або переключимось на data-cloud без історії main
          git fetch origin
          if git ls-remote --exit-code --heads origin data-cloud; then
            git checkout -B data-cloud origin/data-cloud
          else
            git checkout --orphan data-cloud
            rm -rf .* * || true
            git commit --allow-empty -m "init data-cloud"
          fi

          # кладемо JSON у public/out/<run_id>/ та форсуємо додавання попри .gitignore
          mkdir -p "public/out/${RUN_ID}"
          cp -r ../.tmp_publish/out/* "public/out/${RUN_ID}/" 2>/dev/null || true
          git add -f "public/out/${RUN_ID}"/* 2>/dev/null || true
          git commit -m "publish out for run ${RUN_ID}" || echo "nothing to commit"
          git push -u origin data-cloud
