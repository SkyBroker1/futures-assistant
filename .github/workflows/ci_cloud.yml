name: CI Cloud Collect

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Optional run tag shown in run_meta.json
        required: false
        default: ""
      commit_msg:
        description: Optional commit message to data-cloud branch
        required: false
        default: "ci: publish run outputs"

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OUT_DIR: out_cloud
  LOGS_DIR: logs_cloud
  DATA_BRANCH: data-cloud

permissions:
  contents: write
  actions: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python -m pip install --upgrade pip
          pip install requests numpy pandas beautifulsoup4 lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}" "${LOGS_DIR}"

      - name: Preflight check
        shell: bash
        run: |
          set -euo pipefail
          echo "[PRE] checking scripts existence"
          test -f scripts/cloud_collect.py || { echo "missing scripts/cloud_collect.py"; exit 2; }
          test -f scripts/postprocess_fill_missing.py || { echo "missing scripts/postprocess_fill_missing.py"; exit 2; }
          test -f scripts/check_quorum.py || { echo "missing scripts/check_quorum.py"; exit 2; }
          echo "[PRE] ok"

      - name: Run collector
        id: collect
        shell: bash
        env:
          RUN_TAG: ${{ github.event.inputs.run_tag }}
        run: |
          set -euo pipefail
          echo "[INFO] start collector"
          set +e
          python scripts/cloud_collect.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}" \
            --run-tag "${RUN_TAG}" \
            2>&1 | tee "${LOGS_DIR}/collector_stdout.txt"
          RC=${PIPESTATUS[0]}
          echo "${RC}" > "${LOGS_DIR}/collector_rc.txt"
          echo "[INFO] collector finished with rc=${RC} (postprocess will run anyway)"
          set -e

      - name: Upload intermediate artifacts (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw_${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/
            ${{ env.LOGS_DIR }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Postprocess fallbacks - fill missing files
        id: postprocess
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] postprocess_fill_missing.py"
          python scripts/postprocess_fill_missing.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}" \
            --gh-run-id "${{ github.run_id }}"
          echo "[INFO] OUT_DIR tree:"
          ls -lah "${OUT_DIR}" || true
          echo "[INFO] LOGS_DIR tree:"
          ls -lah "${LOGS_DIR}" || true
          echo "[INFO] postprocess.log:"
          cat "${LOGS_DIR}/postprocess.log" || true
          echo "[INFO] index.json:"
          cat "${OUT_DIR}/index.json" || true
          echo "[INFO] tripack_meta_v2.json:"
          cat "${OUT_DIR}/tripack_meta_v2.json" || true

      - name: Check quorum and sanity
        id: check
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] check_quorum.py"
          python scripts/check_quorum.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}"

      - name: Upload artifacts (final)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out_${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/
            ${{ env.LOGS_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to data-cloud branch
        if: ${{ steps.check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.inputs.commit_msg }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] publishing to data-cloud branch"
          RUN_DIR="public/out/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DATA_BRANCH":"$DATA_BRANCH" || true
          git checkout "$DATA_BRANCH" || git checkout -b "$DATA_BRANCH"
          mkdir -p "${RUN_DIR}"
          cp -r "${OUT_DIR}/"* "${RUN_DIR}/" || { echo "no files in ${OUT_DIR}"; exit 3; }
          git add "${RUN_DIR}"
          git commit -m "${COMMIT_MSG:-ci: publish run ${RUN_ID}}" || echo "[INFO] nothing to commit"
          git push origin "$DATA_BRANCH"
