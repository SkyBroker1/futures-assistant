name: CI Cloud Collect

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: 'Optional run tag shown in run_meta.json'
        required: false
        default: ''
      commit_msg:
        description: 'Optional commit message to data-cloud branch'
        required: false
        default: 'ci: publish run outputs'

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OUT_DIR: out_cloud
  LOGS_DIR: logs_cloud
  DATA_BRANCH: data-cloud

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install requests numpy pandas beautifulsoup4 lxml
          # якщо є локальні requirements.txt - використаємо також
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create dirs
        run: |
          mkdir -p "${OUT_DIR}" "${LOGS_DIR}"

      - name: Run collector
        id: collect
        shell: bash
        env:
          RUN_TAG: ${{ github.event.inputs.run_tag }}
        run: |
          set -e
          echo "[INFO] start collector"
          python scripts/cloud_collect.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}" \
            --run-tag "${RUN_TAG}" \
            2>&1 | tee "${LOGS_DIR}/collector_stdout.txt" || true
          echo "[INFO] collector finished (errors are tolerated to allow post-fallback step)"

      - name: Upload intermediate artifacts (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw_${{ github.run_id }}
          path: |
            ${OUT_DIR}/
            ${LOGS_DIR}/
          if-no-files-found: warn
          retention-days: 7

      - name: Postprocess fallbacks - fill missing files
        id: postprocess
        run: |
          set -e
          echo "[INFO] postprocess_fill_missing.py"
          python scripts/postprocess_fill_missing.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}" \
            --gh-run-id "${{ github.run_id }}" \
            2>&1 | tee -a "${LOGS_DIR}/collector_stdout.txt"

      - name: Check quorum and sanity
        id: check
        run: |
          set -e
          echo "[INFO] check_quorum.py"
          python scripts/check_quorum.py \
            --out "${OUT_DIR}" \
            --logs "${LOGS_DIR}"

      - name: Upload artifacts (final)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out_${{ github.run_id }}
          path: |
            ${OUT_DIR}/
            ${LOGS_DIR}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to data-cloud branch
        if: ${{ steps.check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.inputs.commit_msg }}
        run: |
          set -e
          echo "[INFO] publishing to data-cloud branch"
          RUN_DIR="public/out/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # створюємо локальну копію data-cloud
          git fetch origin ${DATA_BRANCH}:${DATA_BRANCH} || true
          git checkout ${DATA_BRANCH} || git checkout -b ${DATA_BRANCH}
          mkdir -p "${RUN_DIR}"
          cp -r "${OUT_DIR}/"* "${RUN_DIR}/"
          git add "${RUN_DIR}"
          git commit -m "${COMMIT_MSG:-ci: publish run ${RUN_ID}}" || echo "[INFO] nothing to commit"
          git push origin ${DATA_BRANCH}
