name: Futures Assistant - CI Cloud

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Unit-SMOKE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quick diff markers check
        run: |
          set -euo pipefail
          for f in scripts/cloud_collect.py requirements.txt .github/workflows/ci_cloud.yml; do
            test -f "$f" || continue
            if grep -nE '^(diff --git|@@ |\+{3} |\-{3} )|^@@$' "$f"; then
              echo "::error::${f} має diff-маркери/@@. Встав чистий код/список пакетів."
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: Syntax compile cloud_collect.py
        run: |
          python -m py_compile scripts/cloud_collect.py

      - name: Offline smoke (ETF/CG parsers)
        run: |
          python - << 'PY'
          import json
          # простий офлайн-тест парсерів
          FAKE_HTML = "<table><tr><th>Date</th><th>Flow</th></tr><tr><td>2025-10-29</td><td>$+1</td></tr></table>"
          ok_rows = FAKE_HTML.lower().count("<tr>") - 1
          assert ok_rows >= 1, "ETF rows parse failed"
          FAKE_CG = {"prices":[[1700000000000, 35000.0],[1700000864000, 35123.0]]}
          assert FAKE_CG["prices"][-1][1] > 1000, "BTC sanity failed on fake CG"
          print("SMOKE OK")
          PY

  cloud:
    name: Cloud collect & publish
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanity check sources
        run: |
          set -euo pipefail
          for f in scripts/cloud_collect.py requirements.txt .github/workflows/ci_cloud.yml; do
            if grep -qE '^(diff --git|@@ |\+{3} |\-{3} )|^@@$' "$f"; then
              echo "::error::${f} містить diff-маркери/@@. Встав чистий код."
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -V
          pip list

      - name: Run cloud collector
        env:
          OUT_DIR: out
          LOG_DIR: log
          MAX_JSON_MB: "2.5"
        run: |
          set -euo pipefail
          mkdir -p out log
          python scripts/cloud_collect.py 2>&1 | tee log/collector_stdout.txt

      - name: Write run metadata
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          mkdir -p out
          cat > out/run_meta.json <<EOF
          {
            "run_id": "${RUN_ID}",
            "run_url": "${RUN_URL}",
            "commit": "${SHA}",
            "commit_url": "${COMMIT_URL}",
            "ref": "${REF}",
            "actor": "${ACTOR}",
            "event": "${EVENT}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Echo health to logs
        if: always()
        run: |
          set -e
          test -f out/index.json && jq -r '.generated_at + " conf=" + ( .conf|tostring )' out/index.json || echo "no index.json"
          test -f out/tripack_meta_v2.json && jq -r '.log.quorum' out/tripack_meta_v2.json || echo "no tripack_meta_v2.json"

      - name: Upload cloud artifacts - out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out_cloud
          path: out/
          if-no-files-found: warn

      - name: Upload cloud artifacts - logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_cloud
          path: log/
          if-no-files-found: warn

      - name: Add run summary
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = process.env.RUN_ID;
            const sha = process.env.SHA;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const dataPath = `https://github.com/${owner}/${repo}/tree/data-cloud/public/out/${runId}/`;
            const commitUrl = `https://github.com/${owner}/${repo}/commit/${sha}`;
            await core.summary
              .addHeading('Futures Assistant - summary')
              .addList([
                `Run: ${runUrl}`,
                `Data-cloud: ${dataPath}`,
                `Commit: ${sha.substring(0,10)} (${commitUrl})`
              ]).write();

      - name: Publish JSON to data-cloud branch
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          DEST="public/out/${RUN_ID}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin data-cloud; then
            git checkout -B data-cloud origin/data-cloud
          else
            git checkout --orphan data-cloud
            rm -rf * .[^.]* || true
            echo "# data-cloud" > README.md
            git add README.md
            git commit -m "init data-cloud"
            git push -u origin data-cloud
          fi
          mkdir -p "${DEST}"
          cp -r out/*.json "${DEST}/" 2>/dev/null || true
          git add -f "${DEST}" || true
          git commit -m "Publish out to data-cloud: ${RUN_ID}" || echo "nothing to commit"
          git push origin data-cloud || echo "::warning::push data-cloud skipped"
