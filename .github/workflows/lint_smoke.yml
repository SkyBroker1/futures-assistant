name: Lint & Unit-SMOKE

on:
  workflow_dispatch: {}
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Quick diff markers check
        run: |
          set -e
          for f in scripts/cloud_collect.py tests/smoke_etf_okx_cg.py; do
            [ -f "$f" ] || continue
            ! grep -qE '^(diff --git|@@|\+{3}|\-{3})' "$f" || { echo "::error::$f має diff-маркери"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit-smoke (offline fixtures)
        run: |
          python -m tests.smoke_etf_okx_cg
